name: selftest
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check every script
        run: |
          for file in $(git ls-files '*.mjs' '*.js'); do
            node --check "$file"
          done
      - name: Assert the pinned checker and the action surface
        run: |
          grep -q "711f69e6347ed90b24d8a15f288c429d9042039d" action.yml
          grep -q "711f69e6347ed90b24d8a15f288c429d9042039d" src/check.mjs
          grep -q "711f69e6347ed90b24d8a15f288c429d9042039d" README.md
          grep -q "dsh-standards@1.6.12" src/check.mjs
          grep -q "host-version:" action.yml
          grep -q "advice:" action.yml
          grep -q "DSH_CHECK_ADVICE_OUT" action.yml
      - name: Run the checker on the fixture
        env:
          DSH_CHECKER_REF: 711f69e6347ed90b24d8a15f288c429d9042039d
        run: |
          set -o pipefail
          node src/check.mjs tests/fixture | tee /tmp/out.md
      - name: Assert the report shape
        run: |
          grep -q "DSH plugin check" /tmp/out.md
          grep -q "FLOW: \*\*未跑\*\*" /tmp/out.md
          grep -q "没有需要改的项" /tmp/out.md
          ! grep -q "修复：" /tmp/out.md
          ! grep -q "DSC-01 清单/入口不完整" /tmp/out.md
      - name: Assert the advice is rendered
        env:
          DSH_CHECKER_REF: 711f69e6347ed90b24d8a15f288c429d9042039d
        run: |
          node src/check.mjs tests/fixture-warn | tee /tmp/out-warn.md
          grep -q "DSC-11" /tmp/out-warn.md
          grep -q "修复：" /tmp/out-warn.md
          grep -q "https://github.com/PerryLink/dsh-plugin-guide/blob/" /tmp/out-warn.md
      - name: Assert the advice JSON output
        env:
          DSH_CHECKER_REF: 711f69e6347ed90b24d8a15f288c429d9042039d
          DSH_CHECK_ADVICE_OUT: /tmp/advice.json
        run: |
          node src/check.mjs tests/fixture-warn > /tmp/advice.md
          node -e "const a = JSON.parse(require('fs').readFileSync('/tmp/advice.json', 'utf8')); if (!Array.isArray(a) || a.length === 0) throw new Error('advice output is empty'); for (const x of a) if (!x.source || !x.fix || !x.docsUrl) throw new Error('advice entry is missing source/fix/docsUrl'); console.log('advice entries:', a.length)"
          grep -q "修复：" /tmp/advice.md
      - name: Reserved capability ids are accepted but not judged
        env:
          DSH_CHECKER_REF: 711f69e6347ed90b24d8a15f288c429d9042039d
          DSH_CHECK_ADVICE_OUT: /tmp/reserved-advice.json
        run: |
          node src/check.mjs tests/fixture-reserved | tee /tmp/reserved.md
          # Reserved ids are accepted (not an unknown-id FAIL) and not judged
          # (not an over-declaration WARN), so the action renders no finding.
          grep -q "没有需要改的项" /tmp/reserved.md
          ! grep -q "DSC-11" /tmp/reserved.md
          ! grep -q "修复：" /tmp/reserved.md
          node -e "const a = JSON.parse(require('fs').readFileSync('/tmp/reserved-advice.json', 'utf8')); if (!Array.isArray(a) || a.length !== 0) throw new Error('reserved capability ids must not produce advice: ' + JSON.stringify(a)); console.log('reserved advice entries:', a.length)"
          # The same surface from the checker's own report (cached by the fixture
          # step above): C-11.1 does not reject the ids, C-11.5 reports them as NA.
          checker="$RUNNER_TEMP/dsh-standards-$DSH_CHECKER_REF/40-checker/bin/dsh-plugin-verify.mjs"
          test -f "$checker"
          node "$checker" tests/fixture-reserved --scope entry --entry-claim static --format json > /tmp/reserved.json
          node -e "const r = JSON.parse(require('fs').readFileSync('/tmp/reserved.json', 'utf8')); const c = r.checks.find((x) => x.id === 'DSC-11'); if (!c) throw new Error('DSC-11 missing from the checker report'); const rows = c.details.filter((d) => d.item === 'C-11.5' && d.result === 'NA' && /reserved capability/.test(d.reason)); if (rows.length !== 2) throw new Error('expected 2 reserved-capability NA rows, got ' + rows.length); if (c.details.some((d) => d.item === 'C-11.1' && d.result === 'FAIL')) throw new Error('a reserved capability id was rejected by C-11.1'); if (c.result === 'FAIL' || c.result === 'WARN') throw new Error('DSC-11 must stay NA for reserved-only capabilities, got ' + c.result); console.log('reserved NA rows:', rows.length, 'DSC-11:', c.result)"
      - name: Forward host-version to the checker anchor
        env:
          DSH_CHECK_HOST_VERSION: 9.9.9
        run: |
          node src/check.mjs tests/fixture > /tmp/host-version.md
          grep -q "9.9.9" /tmp/host-version.md
      - name: Fall back to the local rule card without advice
        run: |
          # v1.1.2 / bf548ac: the last release before the additive advice[].
          curl -sSL --retry 3 https://codeload.github.com/PerryLink/dsh-standards/tar.gz/bf548acbc5909e503b9a29b89d665fb538c1d146 | tar xz -C "$RUNNER_TEMP"
          DSH_CHECKER_DIR="$RUNNER_TEMP/dsh-standards-bf548acbc5909e503b9a29b89d665fb538c1d146" node src/check.mjs tests/fixture > /tmp/fallback.md
          grep -q "DSC-11 未声明 dsh.capabilities" /tmp/fallback.md
          ! grep -q "修复：" /tmp/fallback.md
