name: DSH plugin check
description: Read-only ENTRY checks for a DSH plugin, with rule-based suggestions (no model calls).
author: PerryLink
branding:
  icon: check-circle
  color: blue
inputs:
  path:
    description: Path to the plugin package inside the repository.
    required: false
    default: '.'
  comment:
    description: Post or update a sticky pull-request comment with the result.
    required: false
    default: 'true'
  fail-on:
    description: 'none (advisory, default) or entry (fail the job when ENTRY has a hard failure).'
    required: false
    default: 'none'
  host-version:
    description: 'Optional dsh version the host runs, used for the C-2 anchor (for the current line use 0.2.2-rc.3). When empty, C-2 is NA (compatibility not judged), not a pass. Forwarded as --host-version, or as --runtime-version when the pinned checker has no --host-version; ignored (with a log note) when the checker accepts neither.'
    required: false
    default: ''
outputs:
  markdown:
    description: The rendered markdown report.
    value: ${{ steps.check.outputs.markdown }}
  advice:
    description: 'The checker advice[] entries as a JSON array; [] when the pinned checker does not emit advice.'
    value: ${{ steps.check.outputs.advice }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - id: check
      shell: bash
      env:
        DSH_CHECK_FAIL_ON: ${{ inputs.fail-on }}
        DSH_CHECK_HOST_VERSION: ${{ inputs.host-version }}
        DSH_CHECK_ADVICE_OUT: ${{ runner.temp }}/dsh-check-advice.json
        # dsh-standards v1.6.11, pinned to the full commit.
        DSH_CHECKER_REF: e73b77f9a4dded696d71fc5c76d7fb070b18b1e2
      run: |
        status=0
        node "${{ github.action_path }}/src/check.mjs" "${{ inputs.path }}" > "$RUNNER_TEMP/dsh-check.md" || status=$?
        if [ -n "$GITHUB_STEP_SUMMARY" ]; then
          cat "$RUNNER_TEMP/dsh-check.md" >> "$GITHUB_STEP_SUMMARY"
        fi
        {
          echo "markdown<<DSH_EOF"
          cat "$RUNNER_TEMP/dsh-check.md"
          echo "DSH_EOF"
        } >> "$GITHUB_OUTPUT"
        {
          echo "advice<<DSH_ADVICE_EOF"
          if [ -f "$DSH_CHECK_ADVICE_OUT" ]; then
            cat "$DSH_CHECK_ADVICE_OUT"
          else
            echo "[]"
          fi
          echo "DSH_ADVICE_EOF"
        } >> "$GITHUB_OUTPUT"
        exit "$status"
    # Fork pull requests get a read-only token, so they only get the job summary.
    - if: inputs.comment == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs')
          const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/dsh-check.md`, 'utf8')
          const marker = '<!-- dsh-plugin-check -->'
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
          })
          const prev = comments.find((c) => c.body && c.body.includes(marker))
          if (prev) {
            await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: prev.id, body })
          } else {
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body })
          }
