name: DSH plugin check
description: Read-only ENTRY checks for a DSH plugin, with template-based suggestions (no model calls).
author: PerryLink
branding:
  icon: check-circle
  color: blue
inputs:
  path:
    description: Path to the plugin package inside the repository.
    required: false
    default: '.'
  comment:
    description: Post or update a sticky pull-request comment with the result.
    required: false
    default: 'true'
  fail-on:
    description: 'none (advisory, default) or entry (fail the job when ENTRY has a hard failure).'
    required: false
    default: 'none'
outputs:
  markdown:
    description: The rendered markdown report.
    value: ${{ steps.check.outputs.markdown }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - id: check
      shell: bash
      env:
        DSH_CHECK_FAIL_ON: ${{ inputs.fail-on }}
        DSH_CHECKER_REF: aa0a25c
      run: |
        node "${{ github.action_path }}/src/check.mjs" "${{ inputs.path }}" > "$RUNNER_TEMP/dsh-check.md"
        {
          echo "markdown<<DSH_EOF"
          cat "$RUNNER_TEMP/dsh-check.md"
          echo "DSH_EOF"
        } >> "$GITHUB_OUTPUT"
    - if: inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs')
          const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/dsh-check.md`, 'utf8')
          const marker = '<!-- dsh-plugin-check -->'
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
          })
          const prev = comments.find((c) => c.body && c.body.includes(marker))
          if (prev) {
            await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: prev.id, body })
          } else {
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body })
          }
